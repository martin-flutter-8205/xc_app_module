name: xc_app_module
description: App 装配层：安装各业务 Module、组装 MaterialApp（主题/全局浮层/首屏）。壳工程只调 bootstrap + runApp
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.13.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  # 框架仓库（独立 git 仓库，锁定 main 分支）
  xc_platform:
    git:
      url: git@github.com:martin-flutter-8205/xc_platform.git
      ref: main
  xc_ui:
    git:
      url: git@github.com:martin-flutter-8205/xc_ui.git
      ref: main
  # 业务包（独立 git 仓库，锁定 main 分支）
  xc_launch:
    git:
      url: git@github.com:martin-flutter-8205/xc_launch.git
      ref: main
  xc_index:
    git:
      url: git@github.com:martin-flutter-8205/xc_index.git
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
